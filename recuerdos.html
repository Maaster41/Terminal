<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Núcleo de Recuerdos · Acceso Concedido</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background-color: #0d1117;
    color: #e6edf3;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
    text-align: center;
}

.matrix-heart {
    position: fixed;
    top: -50px;
    font-size: 14px;
    color: #3fb950;
    opacity: 0.5;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to { transform: translateY(110vh); }
}

#contenedor-principal {
    z-index: 10;
    background: rgba(22, 27, 34, 0.9);
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #30363d;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    width: 90%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Contenedor de frases sin altura fija para evitar huecos */
#frases {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 10px;
}

.frase {
    display: none; /* Oculto totalmente hasta que le toque salir */
    font-size: 1.2rem;
    color: #79c0ff;
    margin: 0;
}

.visible {
    display: block; /* Aparece y ocupa su lugar real */
    animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Estilo del GIF ajustado para no dejar aire */
.gif-romantico {
    display: none;
    width: 100%;
    max-width: 200px;
    height: auto;
    border-radius: 10px;
    margin: 10px 0;
    border: 1px solid #30363d;
}

.gif-show {
    display: block;
    animation: fadeIn 1s ease forwards;
}

#aniversario-badge {
    display: none;
    padding: 10px 20px;
    border: 1px solid #3fb950;
    color: #3fb950;
    font-weight: bold;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 10px;
}

.badge-show {
    display: inline-block;
    animation: fadeIn 1s ease forwards;
    box-shadow: 0 0 15px rgba(63, 185, 80, 0.2);
}

#contador {
    margin-top: 20px;
    font-size: 1.1rem;
    color: #ffa657;
    border-top: 1px solid #30363d;
    padding-top: 15px;
    width: 100%;
}
</style>
</head>
<body>

<div id="contenedor-principal">
    <div id="frases"></div>
    
    <img src="https://i.pinimg.com/originals/b1/18/9e/b1189e353db0bed3521885bec284264b.gif" class="gif-romantico" id="gif-animado">
    
    <div id="aniversario-badge">[ LOGRO: 1/2 AÑO ]</div>
    
    <div id="contador"></div>
</div>

<script>
const inicio = new Date("2025-10-31T00:00:00");
const ahora = new Date();
const diasReales = Math.floor((ahora - inicio) / 86400000);

const textos = [
    "> Accediendo a memoria...",
    `> Registro: ${diasReales} días.`,
    "> Compatibilidad: Perfecta.",
    "> Eres mi mejor actualización.",
    "> Feliz medio año, Cristina. ❤️"
];

const contenedor = document.getElementById("frases");
const gif = document.getElementById("gif-animado");
const badge = document.getElementById("aniversario-badge");

// Función para mostrar elementos uno tras otro sin dejar huecos
function mostrarSecuencia(i = 0) {
    if (i < textos.length) {
        const div = document.createElement("div");
        div.className = "frase visible";
        div.textContent = textos[i];
        contenedor.appendChild(div);
        setTimeout(() => mostrarSecuencia(i + 1), 1500);
    } else {
        // Al final, mostramos el gif y el badge pegados
        gif.classList.add("gif-show");
        badge.classList.add("badge-show");
    }
}

mostrarSecuencia();

function actualizarContador() {
    const ahoraActual = new Date();
    let diff = ahoraActual - inicio;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById("contador").innerHTML = `UPTIME: ${d}d:${h}h:${m}m:${s}s`;
}
setInterval(actualizarContador, 1000);
actualizarContador();

setInterval(() => {
    const c = document.createElement("div");
    c.className = "matrix-heart";
    const symbols = ["❤️", "0", "1", "💕"];
    c.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
}, 250);
</script>

</body>
</html>
